<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Internal connections assembly</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="pui" data-appearance="light">
    <main id="assembly"></main>
    <script type="module">
      import {mountMCPConnections} from './mcp.ts';
      const mount = document.getElementById('assembly');
      if (!(mount instanceof HTMLElement)) throw new Error('Missing assembly mount.');
      const simulated = () => ({ok: false, error: 'Simulated action: this example does not connect to or save an external tool server.'});
      const connections = mountMCPConnections(mount, {}, {onSubmit: simulated, onRefresh: simulated, onConnectionAction: simulated}, {appearance: 'light'});
      connections.setConnections([{name: 'demo-tools', type: 'http', url: 'https://tools.example/mcp', enabled: true, oauth: true, signedIn: false, statusLabel: 'Connects automatically when a task starts'}]);
    </script>
  </body>
</html>
