<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Internal settings assembly</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="pui" data-appearance="light">
    <main id="assembly"></main>
    <script type="module">
      import {mountSettings} from './settings.ts';
      const mount = document.getElementById('assembly');
      if (!(mount instanceof HTMLElement)) throw new Error('Missing assembly mount.');
      const simulated = () => ({ok: false, error: 'Simulated action: this example does not save credentials or install updates.'});
      const settings = mountSettings(mount, {baseUrl: 'https://provider.example/v1', hasApiKey: true, ready: true, appearance: {mode: 'light'}}, {
        onSubmit: simulated, onRemoveKey: simulated, onTest: simulated, onProviderAction: simulated,
        onUpdateAction: simulated, onCreateConnection: simulated, onDiagnostics: simulated,
      }, {appearance: 'light'}, 'Pith Desk');
      settings.setProviders([{id: 'demo', name: 'Demonstration provider', configured: true}], 'demo');
      settings.setCredential({status: 'Configured', hidden: false, required: false, placeholder: 'Leave blank to keep this provider’s key', removeVisible: true,
        providerActions: {id: 'demo', oauth: true, signedIn: false, custom: true}});
      settings.updateUpdates({version: '0.1.0-rc.27', enabled: true, phase: 'available', availableVersion: '0.1.0-rc.28', progress: 0, message: 'An update is available.'});
    </script>
  </body>
</html>
