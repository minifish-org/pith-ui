<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internal frame and navigation composition</title>
<body>
<div id="app"></div>
<script type="module">
  import '../../src/styles.css';
  import {mountParts} from '../../src/parts/index.ts';
  import {composeFrame} from './frame.ts';
  import {composeSettings} from './settings.ts';

  const settings = composeSettings({baseUrl: 'https://example.test/v1',hasApiKey: false,ready: true}, {
    onAppearanceChange(mode) {mounted.setAppearance(mode);},
  }, 'Pith Desk');
  const frame = composeFrame({workspace: 'Project',conversation: 'Original conversation',compactDisabled: true,navigation: {empty: null,groups: [
    {id: 'project',name: 'Project',path: '/project',selected: true,children: [
      {id: 'current',title: 'Original conversation',active: true,status: {kind: 'approval'}},
      {id: 'running',title: 'Running task',active: false,status: {kind: 'running'}},
      {id: 'complete',title: 'Completed notes',active: false,status: {kind: 'unread'}},
    ]},
    {id: 'other',name: 'Other workspace',path: '/other',selected: false,children: []},
  ]}}, {onAction(action) {if (action === 'settings') settings.open();}}, {dialogs: [settings.part]});
  const mounted = mountParts(document.getElementById('app'),frame.part);
  addEventListener('pagehide', () => {settings.destroy();frame.destroy();mounted.destroy();},{once: true});
</script>
</body>
</html>
