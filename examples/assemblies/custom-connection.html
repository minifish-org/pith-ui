<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Internal independent connection assembly</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="pui" data-appearance="light">
    <main id="assembly"></main>
    <script type="module">
      import {mountCustomConnection} from './custom-connection.ts';
      const mount = document.getElementById('assembly');
      if (!(mount instanceof HTMLElement)) throw new Error('Missing assembly mount.');
      mountCustomConnection(mount, {name: 'Demonstration endpoint', baseUrl: 'https://endpoint.example/v1', api: 'openai-completions', editing: false,
        models: [{id: 'demo-model', contextWindow: 128000, maxTokens: 8192}]},
      {onSubmit: () => ({ok: false, error: 'Simulated action: this example does not save a provider or send credentials.'})}, {appearance: 'light'});
    </script>
  </body>
</html>
