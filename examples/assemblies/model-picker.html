<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Internal model picker assembly</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="pui" data-appearance="light">
    <main id="assembly"></main>
    <script type="module">
      import {mountModelPicker} from './model-picker.ts';
      const mount = document.getElementById('assembly');
      if (!(mount instanceof HTMLElement)) throw new Error('Missing assembly mount.');
      mountModelPicker(mount, {editor: {
        providers: [{id: 'demo', name: 'Demonstration provider'}],
        models: [{id: 'demo-model', name: 'Demonstration model', provider: 'demo', thinkingLevels: ['off', 'medium', 'high'], supportsImages: true, contextWindow: 128000, maxTokens: 8192}],
        selection: {provider: 'demo', model: 'demo-model', thinkingLevel: 'high'},
      }}, {onSubmit: () => ({ok: false, error: 'Simulated action: this example does not save a provider or model.'})}, {appearance: 'light'});
    </script>
  </body>
</html>
