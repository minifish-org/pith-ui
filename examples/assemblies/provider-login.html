<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Internal provider sign-in assembly</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="pui" data-appearance="light">
    <main id="assembly"></main>
    <script type="module">
      import {mountProviderLogin} from './provider-login.ts';
      const mount = document.getElementById('assembly');
      if (!(mount instanceof HTMLElement)) throw new Error('Missing assembly mount.');
      mountProviderLogin(mount, {phase: 'prompt', message: 'A simulated provider requests an answer.', prompt: 'Verification answer', promptType: 'text'},
        {onAnswer: () => ({ok: false, error: 'Simulated action: this example does not send answers or contact a provider.'})}, {appearance: 'light'});
    </script>
  </body>
</html>
