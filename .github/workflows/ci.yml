name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Select checks
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node --experimental-strip-types scripts/ci-scope.ts
      - run: npm install --global npm@11.12.1
        if: steps.scope.outputs.install == 'true'
      - run: npm ci
        if: steps.scope.outputs.install == 'true'
      - run: npm run build
        if: steps.scope.outputs.install == 'true'
      - run: npm run check
        if: steps.scope.outputs.install == 'true'
      - run: npm test
        if: steps.scope.outputs.unit == 'true'
      - run: npm run test:tools
        if: steps.scope.outputs.unit == 'true'
      - run: node scripts/catalog.ts
        if: steps.scope.outputs.package == 'true'
      - run: node scripts/api-docs.ts --check
        if: steps.scope.outputs.package == 'true'
      - run: npx --no-install playwright install --with-deps --only-shell chromium webkit
        if: steps.scope.outputs.browser == 'true'
      - run: npm run test:browser -- --workers=4
        if: steps.scope.outputs.browser == 'true'
      - run: npm run showroom:build -- --base /pith-ui/ --outDir showroom-dist
        if: steps.scope.outputs.package == 'true'
      - run: node scripts/release.ts pack
        if: steps.scope.outputs.package == 'true'
      # The installed archive checks assembly examples and imports once, with
      # the actual public declarations and both consumer production builds.
      - run: node scripts/release.ts verify
        if: steps.scope.outputs.package == 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.scope.outputs.package == 'true'
        with:
          name: package-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.scope.outputs.package == 'true'
        with:
          name: showroom-${{ github.sha }}
          path: showroom-dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-results-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
