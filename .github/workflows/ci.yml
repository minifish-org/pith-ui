name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npm run test:tools
      - run: node scripts/verify-assemblies.ts
      - run: node scripts/catalog.ts
      - run: node scripts/api-docs.ts --check
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: npm run test:browser -- --workers=4
      - run: npm run showroom:build -- --base /pith-ui/ --outDir showroom-dist
      - run: node scripts/release.ts pack
      - run: node scripts/release.ts verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-results-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
